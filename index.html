<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="NAPOfavicon.png" type="image/png">

  <title>複合英雄強さ計算ツール</title>
  <script src="heroData.js"></script>
  <script src="constants.js"></script>
  <script src="calcEngine.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // アイコンコンポーネント
    const ShieldIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    );

    const SwordsIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"></path>
      </svg>
    );

    const UsersIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const SettingsIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6M5.6 5.6l4.2 4.2m4.2 4.2 4.2 4.2M1 12h6m6 0h6M5.6 18.4l4.2-4.2m4.2-4.2 4.2-4.2"></path>
      </svg>
    );

    const CalculatorIcon = () => (
      <svg className="icon icon-large" viewBox="0 0 24 24">
        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
        <line x1="8" y1="6" x2="16" y2="6"></line>
        <line x1="16" y1="14" x2="16" y2="18"></line>
        <line x1="8" y1="14" x2="8" y2="18"></line>
        <line x1="12" y1="14" x2="12" y2="18"></line>
      </svg>
    );

    const AlertIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    );

    const AwakeningIcon = () => (
      <svg className="icon" viewBox="0 0 24 24">
        <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"></path>
        <path d="M19 15l0.8 2.2L22 18l-2.2 0.8L19 21l-0.8-2.2L16 18l2.2-0.8z"></path>
      </svg>
    );

    // タイタン装備アイコン
    const RifleIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <path d="M6 8h8M6 12h8M6 16h8M14 4h3a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-3M2 8h2M2 12h2M2 16h2"></path>
        <rect x="14" y="8" width="6" height="4" rx="1"></rect>
      </svg>
    );

    const ArmorIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V6l-8-4z"></path>
        <path d="M12 8v8M8 10l4 2 4-2"></path>
      </svg>
    );

    const VisionIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
        <path d="M2 12h3M19 12h3M12 2v3M12 19v3"></path>
      </svg>
    );

    const HeadIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
    );

    const HandyIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
      </svg>
    );

    const BootsIcon = () => (
      <svg className="titan-slot-icon" viewBox="0 0 24 24">
        <path d="M6 3v6l-3 4v5a3 3 0 0 0 3 3h2"></path>
        <path d="M14 3v6l3 4v5a3 3 0 0 1-3 3h-2"></path>
        <path d="M6 9h8M6 15h8"></path>
      </svg>
    );

    const slotIcons = {
      rifle: RifleIcon,
      armor: ArmorIcon,
      vision: VisionIcon,
      head: HeadIcon,
      handy: HandyIcon,
      boots: BootsIcon
    };


    // ===== 覚醒システム =====
    // 覚醒に対応しているかどうかは heroData.js 側の `awakeningCapable: true` で判定する。
    const isAwakeningCapableHero = (name) => !!(heroData[name] && heroData[name].awakeningCapable);

    // 覚醒スキルのスロット数（4つ固定）とレベル範囲（0～10）
    const AWAKENING_SKILL_COUNT = 4;
    // 【用語】覚醒スキルの強化段階は「ランク」と呼ぶ（0～10）。旧称「レベル」から統一。
    const AWAKENING_SKILL_MAX_RANK = 10;
    const AWAKENING_SKILL_LABELS = ['覚醒スキル1', '覚醒スキル2', '覚醒スキル3', '覚醒スキル4'];

    // 英雄1体分の覚醒初期状態（スキル4つ、すべてレベル0）
    // スキルのキーは skill1～skill4（heroData.js の ranks.skillN と対応）
    const AWAKENING_SKILL_KEYS = Array.from({ length: AWAKENING_SKILL_COUNT }, (_, idx) => `skill${idx + 1}`);
    const getDefaultAwakening = () => Object.fromEntries(AWAKENING_SKILL_KEYS.map(k => [k, 0]));
    // 保存データの読み込み用：旧キー(lv1～lv4)も skill1～skill4 に移行し、範囲外の値は丸める
    const normalizeAwakening = (a) => {
      const out = getDefaultAwakening();
      AWAKENING_SKILL_KEYS.forEach((key, idx) => {
        const raw = a ? (a[key] !== undefined ? a[key] : a[`lv${idx + 1}`]) : 0;
        out[key] = Math.max(0, Math.min(AWAKENING_SKILL_MAX_RANK, parseInt(raw) || 0));
      });
      return out;
    };

    // ===== 増分表示（タイタン増分の下に覚醒増分を縦に並べる） =====
    // titan / awakening はそれぞれ増分(%)。0以下や未指定は表示しない。
    function IncreaseStack({ titan, awakening }) {
      const showT = parseFloat(titan) > 0;
      const showA = parseFloat(awakening) > 0;
      if (!showT && !showA) return null;
      return (
        <span className="increase-stack">
          {showT && <span className="result-increase">ﾀｲﾀﾝ +{titan}%</span>}
          {showA && <span className="result-increase result-increase-awakening" title="覚醒ON/OFFでの増分">覚醒 +{awakening}%</span>}
        </span>
      );
    }

    // ===== 増分表示トグル（タイタン／覚醒トグル行の右側に表示） =====
    function IncreaseToggle({ value, onChange }) {
      return (
        <div className="increase-toggle" onClick={() => onChange(!value)}>
          <span className="increase-toggle-label">増分表示: {value ? 'ON' : 'OFF'}</span>
          <div className={`toggle-switch toggle-switch-sm ${value ? 'active' : ''}`}>
            <div className="toggle-slider"></div>
          </div>
        </div>
      );
    }

    // ===== 出力項目の説明ポップアップ =====
    // 説明文は constants.js の statDescriptions を参照。背景クリック・Escで閉じる。
    function StatPopup({ info, onClose }) {
      React.useEffect(() => {
        if (!info) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [info]);
      if (!info) return null;
      const d = statDescriptions[info.key] || { name: info.key, desc: STAT_DESC_PENDING };
      const desc = d.desc || STAT_DESC_PENDING;
      return (
        <div className="stat-popup-overlay" onClick={onClose}>
          <div className="stat-popup" role="dialog" aria-modal="true" onClick={(e) => e.stopPropagation()}>
            <div className="stat-popup-name">{d.name}</div>
            <div className="stat-popup-value">{info.value}</div>
            <div className={`stat-popup-desc ${desc === STAT_DESC_PENDING ? 'pending' : ''}`}>{desc}</div>
            <button className="btn btn-secondary stat-popup-close" onClick={onClose}>閉じる</button>
          </div>
        </div>
      );
    }

    // ===== ダメージ台帳ビュー =====
    // calcEngine.js が返す calculations.damageLedger を表示する。
    // 台帳の各項目は「英雄 / 集計先(AS・PS) / 種類(直接・磁気・燃焼・脆弱) / 由来(通常攻撃・英雄・タイタン・覚醒)」のタグ付き。
    const LEDGER_PHASES = {
      AS: { label: 'AS', desc: '追撃総ダメージ', color: '#fb923c' },
      PS: { label: 'PS', desc: 'パッシブダメージ', color: '#38bdf8' }
    };
    const LEDGER_KINDS = {
      direct: { label: '直接', color: '#e2e8f0' },
      magnetic: { label: '磁気', color: '#60a5fa' },
      burning: { label: '燃焼', color: '#f87171' },
      vulnerable: { label: '脆弱', color: '#c084fc' }
    };
    const LEDGER_ORIGINS = {
      base: { label: '通常攻撃', color: '#94a3b8' },
      hero: { label: '英雄', color: '#a3e635' },
      titan: { label: 'タイタン', color: '#facc15' },
      awakening: { label: '覚醒', color: '#f472b6' }
    };
    const LEDGER_HEARTBEAT_COLOR = '#2dd4bf';
    const LEDGER_COMMON = '共通';   // 通常攻撃など、英雄に属さない項目（engine側の byHero のキーと同じ）

    const ledgerFmt = (v) => (Math.abs(v) < 10 ? v.toFixed(2) : v.toFixed(1));
    const ledgerPct = (r) => (r * 100).toFixed(1) + '%';
    const ledgerTag = (map, key) => map[key] || { label: String(key), color: '#94a3b8', desc: '' };

    const LedgerBadge = ({ color, title, children }) => (
      <span title={title} style={{
        display: 'inline-block', padding: '0 0.4rem', marginRight: '0.25rem', borderRadius: '999px',
        border: `1px solid ${color}`, background: `${color}22`, color: color,
        fontSize: '0.65rem', lineHeight: '1.1rem', whiteSpace: 'nowrap'
      }}>{children}</span>
    );

    const LedgerChips = ({ label, options, value, onChange }) => (
      <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '0.25rem', marginBottom: '0.3rem' }}>
        <span style={{ fontSize: '0.7rem', color: '#94a3b8', minWidth: '3.2rem' }}>{label}</span>
        {options.map(o => {
          const active = value === o.value;
          return (
            <div key={o.value} role="button" tabIndex={0}
              onClick={() => onChange(o.value)}
              onKeyDown={(ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onChange(o.value); } }}
              style={{
                padding: '0.1rem 0.5rem', borderRadius: '999px', fontSize: '0.7rem', cursor: 'pointer', userSelect: 'none',
                border: `1px solid ${active ? '#c084fc' : 'rgba(255,255,255,0.15)'}`,
                background: active ? 'rgba(192,132,252,0.25)' : 'transparent',
                color: active ? '#e9d5ff' : '#94a3b8'
              }}>{o.label}</div>
          );
        })}
      </div>
    );

    const LedgerStackBar = ({ title, segments, total }) => (
      <div style={{ marginBottom: '0.5rem' }}>
        <div style={{ fontSize: '0.68rem', color: '#94a3b8', marginBottom: '0.15rem' }}>{title}</div>
        <div style={{ display: 'flex', height: '10px', borderRadius: '999px', overflow: 'hidden', background: 'rgba(148,163,184,0.2)' }}>
          {segments.filter(s => s.value > 0).map(s => (
            <div key={s.label} title={`${s.label} ${ledgerFmt(s.value)}`}
              style={{ width: `${total > 0 ? (s.value / total) * 100 : 0}%`, background: s.color }} />
          ))}
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.1rem 0.75rem', marginTop: '0.2rem', fontSize: '0.7rem', color: '#cbd5e1' }}>
          {segments.map(s => (
            <span key={s.label}>
              <span style={{ display: 'inline-block', width: '0.5rem', height: '0.5rem', borderRadius: '50%', background: s.color, marginRight: '0.25rem' }} />
              {s.label} {ledgerFmt(s.value)}（{total > 0 ? ledgerPct(s.value / total) : '0.0%'}）
            </span>
          ))}
        </div>
      </div>
    );

    function DamageLedgerView({ ledger, heroNames, titanEnabled, awakeningEnabled }) {
      const [open, setOpen] = useState(true);
      const [view, setView] = useState('hero');        // 'hero'(英雄別) | 'items'(項目一覧)
      const [fPhase, setFPhase] = useState('all');
      const [fKind, setFKind] = useState('all');
      const [fHero, setFHero] = useState('all');
      const [sortMode, setSortMode] = useState('desc'); // 'desc'(ダメージ大きい順) | 'calc'(計算順)

      if (!ledger || !Array.isArray(ledger.entries)) return null;

      const { entries, total, byPhase, byKind, byOrigin, byHero, meta } = ledger;
      const coeff = meta && meta.heartbeatCoeff;
      const heartbeatOn = !!coeff && coeff !== 1;

      // 英雄の並び：編成順 → それ以外（共通など）
      const members = (heroNames || []).filter((n, i, arr) => n && n !== '外す' && n !== '未実装' && arr.indexOf(n) === i);
      const heroKeys = [...members, ...Object.keys(byHero).filter(k => !members.includes(k))];
      const effHero = (fHero !== 'all' && heroKeys.includes(fHero)) ? fHero : 'all';

      const slotLabel = (slot) => { const i = slotNames.indexOf(slot); return i >= 0 ? slotDisplayNames[i] : slot; };

      const filtered = entries.map((e, i) => ({ ...e, _i: i })).filter(e =>
        (fPhase === 'all' || e.phase === fPhase) &&
        (fKind === 'all' || e.kind === fKind) &&
        (effHero === 'all' || (e.hero || LEDGER_COMMON) === effHero));
      const rows = sortMode === 'desc' ? [...filtered].sort((a, b) => b.value - a.value) : filtered;
      const filteredTotal = filtered.reduce((s, e) => s + e.value, 0);
      const maxValue = rows.reduce((m, e) => Math.max(m, e.value), 0);

      const cols = [
        { key: 'AS', label: 'AS', color: LEDGER_PHASES.AS.color, get: (h) => h.AS },
        { key: 'PS', label: 'PS', color: LEDGER_PHASES.PS.color, get: (h) => h.PS },
        { key: 'direct', label: '直接', color: LEDGER_KINDS.direct.color, get: (h) => h.direct },
        { key: 'magnetic', label: '磁気', color: LEDGER_KINDS.magnetic.color, get: (h) => h.magnetic },
        { key: 'burning', label: '燃焼', color: LEDGER_KINDS.burning.color, get: (h) => h.burning },
        { key: 'vulnerable', label: '脆弱', color: LEDGER_KINDS.vulnerable.color, get: (h) => h.vulnerable }
      ];
      const zeroHero = { total: 0, AS: 0, PS: 0, direct: 0, magnetic: 0, burning: 0, vulnerable: 0 };
      const totalRow = { total, AS: byPhase.AS, PS: byPhase.PS, direct: byKind.direct, magnetic: byKind.magnetic, burning: byKind.burning, vulnerable: byKind.vulnerable };
      const th = { padding: '0.25rem 0.4rem', textAlign: 'right', fontWeight: 600, whiteSpace: 'nowrap', borderBottom: '1px solid rgba(255,255,255,0.15)' };
      const td = { padding: '0.25rem 0.4rem', textAlign: 'right', whiteSpace: 'nowrap' };
      const cell = (v) => (v > 0 ? ledgerFmt(v) : <span style={{ color: '#475569' }}>–</span>);

      return (
        <div style={{ marginTop: '0.75rem', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '0.5rem', overflow: 'hidden' }}>
          <div onClick={() => setOpen(!open)} style={{ padding: '0.4rem 0.75rem', cursor: 'pointer', background: 'rgba(255,255,255,0.05)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: '0.8rem', fontWeight: 600, color: '#c084fc' }}>ダメージ台帳</span>
            <span className={`collapse-icon ${!open ? 'collapsed' : ''}`} style={{ fontSize: '0.875rem' }}>▼</span>
          </div>
          {open && (
            <div style={{ padding: '0.75rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>合計ダメージ（AS＋PS）</span>
                <span style={{ fontSize: '1.1rem', fontWeight: 700, color: '#f8fafc' }}>{ledgerFmt(total)}%</span>
              </div>
              <div style={{ fontSize: '0.68rem', color: '#94a3b8', marginBottom: '0.6rem' }}>
                タイタン{titanEnabled ? 'あり' : 'なし'}・覚醒{awakeningEnabled ? 'あり' : 'なし'}の状態（上の英雄火力と同じ条件）
              </div>

              <LedgerStackBar title="集計先" total={total} segments={[
                { label: 'AS（追撃総ダメージ）', value: byPhase.AS, color: LEDGER_PHASES.AS.color },
                { label: 'PS（パッシブ）', value: byPhase.PS, color: LEDGER_PHASES.PS.color }
              ]} />
              <LedgerStackBar title="種類" total={total} segments={
                Object.keys(LEDGER_KINDS).map(k => ({ label: LEDGER_KINDS[k].label, value: byKind[k] || 0, color: LEDGER_KINDS[k].color }))
              } />
              <LedgerStackBar title="由来" total={total} segments={
                Object.keys(LEDGER_ORIGINS).map(k => ({ label: LEDGER_ORIGINS[k].label, value: byOrigin[k] || 0, color: LEDGER_ORIGINS[k].color }))
              } />

              <div style={{ marginTop: '0.6rem' }}>
                <LedgerChips label="表示" value={view} onChange={setView} options={[
                  { value: 'hero', label: '英雄別' }, { value: 'items', label: '項目一覧' }
                ]} />
              </div>

              {view === 'hero' ? (
                <div>
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.7rem', color: '#e2e8f0' }}>
                      <thead>
                        <tr>
                          <th style={{ ...th, textAlign: 'left', color: '#94a3b8' }}>英雄</th>
                          <th style={{ ...th, color: '#94a3b8' }}>合計</th>
                          <th style={{ ...th, color: '#94a3b8' }}>割合</th>
                          {cols.map(c => <th key={c.key} style={{ ...th, color: c.color }}>{c.label}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {heroKeys.map(name => {
                          const h = byHero[name] || zeroHero;
                          return (
                            <tr key={name} title="クリックで項目一覧に絞り込み"
                              onClick={() => { setFHero(name); setFPhase('all'); setFKind('all'); setView('items'); }}
                              style={{ cursor: 'pointer', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
                              <td style={{ ...td, textAlign: 'left', color: '#c084fc', fontWeight: 600 }}>{name}</td>
                              <td style={{ ...td, fontWeight: 600 }}>{cell(h.total)}</td>
                              <td style={{ ...td, color: '#94a3b8' }}>{h.total > 0 && total > 0 ? ledgerPct(h.total / total) : <span style={{ color: '#475569' }}>–</span>}</td>
                              {cols.map(c => <td key={c.key} style={td}>{cell(c.get(h))}</td>)}
                            </tr>
                          );
                        })}
                        <tr style={{ borderTop: '1px solid rgba(255,255,255,0.2)', fontWeight: 700 }}>
                          <td style={{ ...td, textAlign: 'left' }}>合計</td>
                          <td style={td}>{ledgerFmt(totalRow.total)}</td>
                          <td style={{ ...td, color: '#94a3b8' }}>100.0%</td>
                          {cols.map(c => <td key={c.key} style={td}>{cell(c.get(totalRow))}</td>)}
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div style={{ fontSize: '0.68rem', color: '#64748b', marginTop: '0.3rem' }}>行をタップすると、その英雄の項目一覧を表示します。</div>
                </div>
              ) : (
                <div>
                  <LedgerChips label="集計先" value={fPhase} onChange={setFPhase} options={[
                    { value: 'all', label: 'すべて' }, { value: 'AS', label: 'AS' }, { value: 'PS', label: 'PS' }
                  ]} />
                  <LedgerChips label="種類" value={fKind} onChange={setFKind} options={[
                    { value: 'all', label: 'すべて' },
                    ...Object.keys(LEDGER_KINDS).map(k => ({ value: k, label: LEDGER_KINDS[k].label }))
                  ]} />
                  <LedgerChips label="英雄" value={effHero} onChange={setFHero} options={[
                    { value: 'all', label: 'すべて' }, ...heroKeys.map(n => ({ value: n, label: n }))
                  ]} />
                  <LedgerChips label="並び" value={sortMode} onChange={setSortMode} options={[
                    { value: 'desc', label: '大きい順' }, { value: 'calc', label: '計算順' }
                  ]} />
                  <div style={{ maxHeight: '22rem', overflowY: 'auto', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '0.375rem' }}>
                    {rows.length === 0 && (
                      <div style={{ padding: '0.75rem', fontSize: '0.75rem', color: '#94a3b8', textAlign: 'center' }}>該当する項目がありません</div>
                    )}
                    {rows.map(e => {
                      const ph = ledgerTag(LEDGER_PHASES, e.phase), kd = ledgerTag(LEDGER_KINDS, e.kind), og = ledgerTag(LEDGER_ORIGINS, e.origin);
                      return (
                        <div key={e._i} style={{ padding: '0.35rem 0.5rem', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '0.5rem' }}>
                            <div style={{ fontSize: '0.75rem', color: '#e2e8f0', minWidth: 0 }}>
                              <span style={{ color: '#c084fc', fontWeight: 600, marginRight: '0.4rem' }}>{e.hero || LEDGER_COMMON}</span>
                              {e.source}{e.slot ? `（${slotLabel(e.slot)}）` : ''}
                            </div>
                            <div style={{ fontSize: '0.8rem', fontWeight: 600, color: '#f8fafc', whiteSpace: 'nowrap' }}>
                              {ledgerFmt(e.value)} <span style={{ fontSize: '0.65rem', color: '#94a3b8', fontWeight: 400 }}>{ledgerPct(e.share)}</span>
                            </div>
                          </div>
                          <div style={{ marginTop: '0.15rem' }}>
                            <LedgerBadge color={ph.color} title={ph.desc}>{ph.label}</LedgerBadge>
                            <LedgerBadge color={kd.color}>{kd.label}</LedgerBadge>
                            <LedgerBadge color={og.color}>{og.label}</LedgerBadge>
                            {e.heartbeat && <LedgerBadge color={LEDGER_HEARTBEAT_COLOR} title="鼓動の係数が反映済み（通常攻撃・連撃のみ）">鼓動</LedgerBadge>}
                          </div>
                          <div style={{ height: '3px', marginTop: '0.25rem', background: 'rgba(148,163,184,0.15)', borderRadius: '999px' }}>
                            <div style={{ height: '100%', width: `${maxValue > 0 ? (e.value / maxValue) * 100 : 0}%`, background: ph.color, borderRadius: '999px' }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ fontSize: '0.7rem', color: '#cbd5e1', marginTop: '0.3rem' }}>
                    表示中 {rows.length}件 ／ 合計 {ledgerFmt(filteredTotal)}%（全体の {total > 0 ? ledgerPct(filteredTotal / total) : '0.0%'}）
                  </div>
                </div>
              )}

              <div style={{ marginTop: '0.6rem', fontSize: '0.68rem', color: '#94a3b8', lineHeight: 1.5 }}>
                <div>AS＝追撃総ダメージ、PS＝パッシブダメージ。集計先は実際に加算された側で表示します（例：アカネ・フェルムのPS磁気はAS側）。AS＋PSの合計が英雄火力の計算元です。</div>
                {heartbeatOn && (
                  <div>鼓動（係数×{coeff.toFixed(4)}）は通常攻撃と連撃にのみ反映されます。「鼓動」タグ付きの値は反映後の数値です。</div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function GameCalculator() {
      // デフォルト値（「デフォルト設定を読み込む」で復元される初期状態）
      const DEFAULT_BUFFS = {
        troops: 220,
        soldierLv: 103,
        life: 3500,
        attack: 3500,
        damageIncrease: 500,
        damageReduction: 500,
        defense: 160,
        typeAdvantage: 150,
        baseShield: 33,
        silenceCount: 0,
        enemyWeakenAmount: 0,
        enemyIronWall: '専用5',
        powerDiff: 1.0,
        enemyRushRatio: 0.15,
        enemyPowerDurabilityRatio: 0.3,
        myPowerDurabilityRatio: 0.3,
        speedCondition: '同攻速',
        directDamageRatio: 0.1,
        enemyASRatio: 0.5,
        enemyMagneticBurningRatio: 0.28,
        enemyAbnormalDamageReduction: 0,
        powerDivergenceCoef: 1.4
      };
      const DEFAULT_COMPATIBILITY = '同兵種';
      const DEFAULT_TITAN_ENABLED = true;
      const DEFAULT_HEROES = [
        { name: 'フランカ', exclusiveLv: 5 },
        { name: 'ミヤ', exclusiveLv: 5 },
        { name: 'ルネ', exclusiveLv: 5 }
      ];
      const DEFAULT_EXCLUSIVE_LV = 5;

      const [buffs, setBuffs] = useState({ ...DEFAULT_BUFFS });

      const [compatibility, setCompatibility] = useState(DEFAULT_COMPATIBILITY);
      const [titanEnabled, setTitanEnabled] = useState(DEFAULT_TITAN_ENABLED);
      // 覚醒ON/OFF。OFF＝覚醒実装前の状態＝全スキルランク0と同義（スライダー値はそのまま保持し、計算にのみ反映しない）
      const [awakeningEnabled, setAwakeningEnabled] = useState(true);
      // 増分表示のON/OFF（タイタン／覚醒それぞれ。初期ON。効果自体がOFFのときはトグル非表示・増分も出さない）
      const [titanIncreaseVisible, setTitanIncreaseVisible] = useState(true);
      const [awakeningIncreaseVisible, setAwakeningIncreaseVisible] = useState(true);
      // 開発ログのページ（0＝最新ページ）
      const [devLogPage, setDevLogPage] = useState(0);
      // タブ（ブラウザ）タイトルのバージョン表記も devLog の最新バージョンに自動追従
      React.useEffect(() => { document.title = `${APP_TITLE} ${APP_VERSION}`; }, []);
      const showTitanInc = titanEnabled && titanIncreaseVisible;
      const showAwakeningInc = awakeningEnabled && awakeningIncreaseVisible;
      
      // ラウンド重み係数
      const [powerRoundWeights, setPowerRoundWeights] = useState(getDefaultPowerRoundWeights('専用5'));
      const [durabilityRoundWeights, setDurabilityRoundWeights] = useState(defaultDurabilityRoundWeights);
      
      // 敵の火力/耐久比に応じて火力ラウンド重み係数を調整する関数
      const adjustPowerWeightsByRatio = (baseWeights, ratio) => {
        // ratio: 0.1～0.5 (デフォルト0.3)
        // 0.3の時はbaseWeightsそのまま
        // 0に近づくほど [0,0,0,1] に近づく（線形補正）
        // 1に近づくほどR4が0に近づき、他が比率維持して上昇
        
        if (ratio === 0.3) return baseWeights;
        
        const target0 = [0, 0, 0, 1]; // ratio=0のターゲット
        
        if (ratio < 0.3) {
          // 0から0.3の間: 線形補間
          const t = ratio / 0.3; // 0～1
          return baseWeights.map((w, i) => w * t + target0[i] * (1 - t));
        } else {
          // 0.3から上: R4を減らし、他を比率維持して増加
          // ratio=1でR4=0を目指す
          const t = (ratio - 0.3) / (0.5 - 0.3); // 0～1 (0.3～0.5で正規化)
          const clampedT = Math.max(0, Math.min(1, t));
          
          // R4を減らす
          const newR4 = baseWeights[3] * (1 - clampedT);
          
          // R1,R2,R3の合計を求める
          const r123Sum = baseWeights[0] + baseWeights[1] + baseWeights[2];
          
          // 減った分を比率維持してR1,R2,R3に分配
          const addAmount = baseWeights[3] * clampedT;
          const newR1 = baseWeights[0] + (baseWeights[0] / r123Sum) * addAmount;
          const newR2 = baseWeights[1] + (baseWeights[1] / r123Sum) * addAmount;
          const newR3 = baseWeights[2] + (baseWeights[2] / r123Sum) * addAmount;
          
          return [newR1, newR2, newR3, newR4];
        }
      };
      
      // 敵の鉄壁条件または火力/耐久比が変更されたら火力ラウンド重み係数を自動更新
      React.useEffect(() => {
        const baseWeights = getDefaultPowerRoundWeights(buffs.enemyIronWall);
        const adjustedWeights = adjustPowerWeightsByRatio(baseWeights, buffs.enemyPowerDurabilityRatio || 0);
        setPowerRoundWeights(adjustedWeights);
      }, [buffs.enemyIronWall, buffs.enemyPowerDurabilityRatio]);
      
      // タブ折りたたみ状態
      const [expandedTabs, setExpandedTabs] = useState({
        buffs: false,
        environment: false,
        heroes: true,
        presets: false,
        saveData: false,
        titanEquip: true,
        awakening: true,
        buffCalc: false,
        heroCalc: true,
        heroCalcDetail: false,
        totalEval: false,
        devLog: false
      });
      
      // 英雄ごとのタイタン装備折りたたみ状態
      const [expandedTitanHeroes, setExpandedTitanHeroes] = useState({
        0: false,
        1: false,
        2: false
      });
      
      // 出力項目クリック → 説明ポップアップ
      const [statPopup, setStatPopup] = useState(null);
      const statProps = (key, value) => ({
        role: 'button',
        tabIndex: 0,
        onClick: () => setStatPopup({ key, value }),
        onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setStatPopup({ key, value }); } }
      });

      const toggleTab = (tabName) => {
        setExpandedTabs(prev => ({...prev, [tabName]: !prev[tabName]}));
      };
      
      const toggleTitanHero = (heroIndex) => {
        setExpandedTitanHeroes(prev => ({...prev, [heroIndex]: !prev[heroIndex]}));
      };

      const [heroes, setHeroes] = useState([...DEFAULT_HEROES]);

      // 一括専用レベル設定（デフォルト: 専用5）
      const [defaultExclusiveLv, setDefaultExclusiveLv] = useState(DEFAULT_EXCLUSIVE_LV);

      const [titanEquip, setTitanEquip] = useState(
        heroes.map(() => slotNames.map(() => ({ effect: '', level: 1 })))
      );

      // 覚醒設定（英雄ごとにスキル1～4のレベルを保持。非対応英雄は常に初期値のまま）
      const [awakening, setAwakening] = useState(
        heroes.map(() => getDefaultAwakening())
      );
      const [expandedAwakeningHeroes, setExpandedAwakeningHeroes] = useState({});
      const toggleAwakeningHero = (heroIndex) => {
        setExpandedAwakeningHeroes(prev => ({...prev, [heroIndex]: !prev[heroIndex]}));
      };
      const updateAwakening = (heroIndex, skillKey, value) => {
        setAwakening(prev => {
          const next = [...prev];
          const clamped = Math.max(0, Math.min(AWAKENING_SKILL_MAX_RANK, parseInt(value) || 0));
          next[heroIndex] = { ...next[heroIndex], [skillKey]: clamped };
          return next;
        });
      };

      // ===== ローカルストレージ保存機能 =====
      const STORAGE_KEY = 'gameCalculatorSaveData';
      const [saveSlots, setSaveSlots] = useState({});
      const [saveMessage, setSaveMessage] = useState('');
      const [newSlotName, setNewSlotName] = useState('');
      const isInitialLoad = React.useRef(true);

      // 現在の入力状態をまとめて取得
      const getCurrentState = () => ({
        buffs,
        compatibility,
        titanEnabled,
        awakeningEnabled,
        titanIncreaseVisible,
        awakeningIncreaseVisible,
        powerRoundWeights,
        durabilityRoundWeights,
        heroes,
        defaultExclusiveLv,
        titanEquip,
        awakening
      });

      // 状態を復元
      const applyState = (state) => {
        if (!state) return;
        if (state.buffs) setBuffs(state.buffs);
        // 旧バージョンの保存データ（「同兵種・不利」）は「同兵種」として扱う
        if (state.compatibility) {
          setCompatibility(state.compatibility === '同兵種・不利' ? '同兵種' : state.compatibility);
        }
        if (typeof state.titanEnabled === 'boolean') setTitanEnabled(state.titanEnabled);
        if (typeof state.awakeningEnabled === 'boolean') setAwakeningEnabled(state.awakeningEnabled);
        if (typeof state.titanIncreaseVisible === 'boolean') setTitanIncreaseVisible(state.titanIncreaseVisible);
        if (typeof state.awakeningIncreaseVisible === 'boolean') setAwakeningIncreaseVisible(state.awakeningIncreaseVisible);
        if (state.powerRoundWeights) setPowerRoundWeights(state.powerRoundWeights);
        if (state.durabilityRoundWeights) setDurabilityRoundWeights(state.durabilityRoundWeights);
        if (state.heroes) setHeroes(state.heroes);
        if (typeof state.defaultExclusiveLv === 'number') setDefaultExclusiveLv(state.defaultExclusiveLv);
        if (state.titanEquip) setTitanEquip(state.titanEquip);
        // 古い保存データ（覚醒実装前）にはawakeningが存在しないため、その場合は英雄数分の初期値で補完
        if (state.awakening) {
          setAwakening(Array.isArray(state.awakening) ? state.awakening.map(normalizeAwakening) : state.heroes ? state.heroes.map(() => getDefaultAwakening()) : state.awakening);
        } else if (state.heroes) {
          setAwakening(state.heroes.map(() => getDefaultAwakening()));
        }
      };

      // 起動時：自動保存された「最後の状態」を読み込み、保存スロット一覧も読み込む
      React.useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.autoSave) {
              applyState(parsed.autoSave);
            }
            if (parsed.slots) {
              setSaveSlots(parsed.slots);
            }
          }
        } catch (e) {
          console.error('ローカルストレージの読み込みに失敗しました', e);
        } finally {
          isInitialLoad.current = false;
        }
      }, []);

      // 入力値が変わるたびに自動保存（「最後の状態」として保持）
      React.useEffect(() => {
        if (isInitialLoad.current) return;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          parsed.autoSave = getCurrentState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        } catch (e) {
          console.error('自動保存に失敗しました', e);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [buffs, compatibility, titanEnabled, awakeningEnabled, titanIncreaseVisible, awakeningIncreaseVisible, powerRoundWeights, durabilityRoundWeights, heroes, defaultExclusiveLv, titanEquip, awakening]);

      // 名前付きスロットへの保存（上書き時は確認）
      const saveToSlot = (slotName, forceOverwrite = false) => {
        if (!slotName) return;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          parsed.slots = parsed.slots || {};

          if (!forceOverwrite && parsed.slots[slotName]) {
            const confirmed = window.confirm(`「${slotName}」は既に存在します。上書き保存しますか？`);
            if (!confirmed) return;
          }

          parsed.slots[slotName] = {
            data: getCurrentState(),
            savedAt: new Date().toLocaleString('ja-JP'),
            heroStrength: calculations?.heroStrength_display ?? null,
            totalStrength: calculations?.totalStrength ?? null
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          setSaveSlots(parsed.slots);
          setSaveMessage(forceOverwrite ? `「${slotName}」を上書き保存しました` : `「${slotName}」に保存しました`);
          setTimeout(() => setSaveMessage(''), 2500);
        } catch (e) {
          console.error('保存に失敗しました', e);
          setSaveMessage('保存に失敗しました');
          setTimeout(() => setSaveMessage(''), 2500);
        }
      };

      // 名前付きスロットの読み込み
      const loadFromSlot = (slotName) => {
        const slot = saveSlots[slotName];
        if (!slot) return;
        applyState(slot.data);
        setSaveMessage(`「${slotName}」を読み込みました`);
        setTimeout(() => setSaveMessage(''), 2500);
      };

      // 名前付きスロットの削除
      const deleteSlot = (slotName) => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          if (parsed.slots) {
            delete parsed.slots[slotName];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            setSaveSlots(parsed.slots);
          }
        } catch (e) {
          console.error('削除に失敗しました', e);
        }
      };

      // デフォルト設定を読み込む（全入力値を初期値に戻す）
      const loadDefaultSettings = () => {
        setBuffs({ ...DEFAULT_BUFFS });
        setCompatibility(DEFAULT_COMPATIBILITY);
        setTitanEnabled(DEFAULT_TITAN_ENABLED);
        setAwakeningEnabled(true);
        setTitanIncreaseVisible(true);
        setAwakeningIncreaseVisible(true);
        setPowerRoundWeights(getDefaultPowerRoundWeights(DEFAULT_BUFFS.enemyIronWall));
        setDurabilityRoundWeights(defaultDurabilityRoundWeights);
        const resetHeroes = DEFAULT_HEROES.map(h => ({ ...h }));
        setHeroes(resetHeroes);
        setDefaultExclusiveLv(DEFAULT_EXCLUSIVE_LV);
        setTitanEquip(resetHeroes.map(() => slotNames.map(() => ({ effect: '', level: 1 }))));
        setAwakening(resetHeroes.map(() => getDefaultAwakening()));
        setSaveMessage('デフォルト設定を読み込みました');
        setTimeout(() => setSaveMessage(''), 2500);
      };
      // ===== ローカルストレージ保存機能ここまで =====

      const numericBuffKeys = new Set([
        'troops', 'soldierLv', 'life', 'attack', 'damageIncrease', 'damageReduction',
        'defense', 'typeAdvantage', 'baseShield', 'silenceCount', 'enemyWeakenAmount',
        'powerDiff', 'enemyRushRatio', 'enemyPowerDurabilityRatio', 'myPowerDurabilityRatio', 'directDamageRatio', 'enemyASRatio', 'enemyMagneticBurningRatio', 'enemyAbnormalDamageReduction', 'powerDivergenceCoef'
      ]);
      
      const updateBuff = (key, value) => {
        if (numericBuffKeys.has(key)) {
          // 空文字列は許可、数値に変換できれば数値を保存、できなければ空文字列を保存
          if (value === '') {
            setBuffs(prev => ({ ...prev, [key]: '' }));
          } else {
            const parsed = parseFloat(value);
            setBuffs(prev => ({ ...prev, [key]: isNaN(parsed) ? '' : parsed }));
          }
        } else {
          // 文字列フィールド（enemyIronWallなど）はそのまま保存
          setBuffs(prev => ({ ...prev, [key]: value }));
        }
      };

      // onBlur時に空文字列を0に補完
      const handleNumericInputBlur = (key) => {
        if (buffs[key] === '') {
          setBuffs(prev => ({ ...prev, [key]: 0 }));
        }
      };

      // onFocus時に0を空文字列に変換（0を削除して入力可能にする）
      const handleNumericInputFocus = (key) => {
        if (buffs[key] === 0) {
          setBuffs(prev => ({ ...prev, [key]: '' }));
        }
      };

      const selectPreset = (presetNum) => {
        const newHeroes = presets[presetNum].map(name => ({ name, exclusiveLv: defaultExclusiveLv }));
        setHeroes(newHeroes);
        setTitanEquip(newHeroes.map(() => slotNames.map(() => ({ effect: '', level: 1 }))));
        setAwakening(newHeroes.map(() => getDefaultAwakening()));
      };

      const updateHero = (index, field, value) => {
        setHeroes(prev => {
          const newHeroes = [...prev];
          if (field === 'name') {
            // 英雄名が変更された場合、一括専用レベルを適用
            newHeroes[index] = { name: value, exclusiveLv: defaultExclusiveLv };
          } else {
            newHeroes[index] = { ...newHeroes[index], [field]: value };
          }
          return newHeroes;
        });
      };

      const updateTitan = (heroIndex, slotIndex, field, value) => {
        setTitanEquip(prev => {
          const newEquip = [...prev];
          newEquip[heroIndex] = [...newEquip[heroIndex]];
          newEquip[heroIndex][slotIndex] = {
            ...newEquip[heroIndex][slotIndex],
            [field]: value
          };
          return newEquip;
        });
      };

      // 計算処理
      const calculations = useMemo(() => calculateAll({
        buffs, compatibility, heroes, titanEquip, titanEnabled, awakeningEnabled,
        powerRoundWeights, durabilityRoundWeights, awakening
      }), [buffs, compatibility, heroes, titanEquip, titanEnabled, awakeningEnabled, powerRoundWeights, durabilityRoundWeights, awakening]);

      return (
        <div className="container">
          {/* ヘッダー */}
          <div className="header">
            <h1>
              <CalculatorIcon />
              複合英雄強さ計算ツール
              <span className="version-badge">{APP_VERSION}</span>
            </h1>
            <p>Designed by Napo,  Coded by Claude.ai</p>
          </div>

          {/* 保存データ（折りたたみ可能・バフ設定の上に独立配置） */}
          <div className="card" style={{ marginBottom: '1.5rem' }}>
            <div className="card-header" onClick={() => toggleTab('saveData')}>
              <h2>💾 保存データ</h2>
              <span className={`collapse-icon ${!expandedTabs.saveData ? 'collapsed' : ''}`}>▼</span>
            </div>
            <div className={`card-content ${!expandedTabs.saveData ? 'hidden' : ''}`}>
              <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginBottom: '0.75rem' }}>
                現在の入力値（バフ・環境・英雄・装備など）は常に自動でこのブラウザに保存され、次回開いたときに復元されます。
                さらに、名前を付けて複数の編成を保存・呼び出しできます。保存済みデータの「上書き」ボタンで、現在の入力内容を既存データに上書きできます。
              </div>

              {/* 新規保存＋デフォルト読込 */}
              <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
                <input
                  type="text"
                  value={newSlotName}
                  onChange={(e) => setNewSlotName(e.target.value)}
                  placeholder="保存名を入力（例：磁気編成専5）"
                  className="form-input"
                  style={{ flex: 1, minWidth: '160px' }}
                />
                <button
                  onClick={() => {
                    if (newSlotName.trim()) {
                      saveToSlot(newSlotName.trim());
                      setNewSlotName('');
                    }
                  }}
                  className="btn btn-primary"
                  style={{ whiteSpace: 'nowrap' }}
                >

                  <div className="result-grid-2">
                    <div className="result-box result-clickable" {...statProps('totalDurability', formatNumber(calculations.totalDurability))}>
                      <div className="result-label">
                        <span>総合耐久</span>
                      </div>
                      <div className="result-value value-green">
                        {formatNumber(calculations.totalDurability)}
                      </div>
                      {(showTitanInc && calculations.increases.totalDurability > 0) || (compatibility === '相性有利' && calculations.increases.compatibilityDurationBonus > 0) ? (
                        <div className="increase-row">
                          {showTitanInc && calculations.increases.totalDurability > 0 && (
                            <span className="result-increase">+{calculations.increases.totalDurability}%</span>
                          )}
                          {compatibility === '相性有利' && calculations.increases.compatibilityDurationBonus > 0 && (
                            <span className="compat-increase"> {showTitanInc && calculations.increases.totalDurability > 0 ? '' : ''}相性増分 +{calculations.increases.compatibilityDurationBonus}%</span>
                          )}
                        </div>
                      ) : null}
                      {showAwakeningInc && calculations.awakeningIncreases.totalDurability > 0 && (
                        <div className="increase-row-awakening">
                          <span className="result-increase result-increase-awakening" title="覚醒ON/OFFでの増分">覚醒 +{calculations.awakeningIncreases.totalDurability}%</span>
                        </div>
                      )}
                    </div>
                    <div className="result-box result-clickable" {...statProps('totalPower', formatNumber(calculations.totalPower))}>
                      <div className="result-label">
                        <span>総合火力</span>
                      </div>
                      <div className="result-value value-red">
                        {formatNumber(calculations.totalPower)}
                      </div>
                      {(showTitanInc && calculations.increases.totalPower > 0) || (compatibility === '相性有利' && calculations.increases.compatibilityPowerBonus > 0) ? (
                        <div className="increase-row">
                          {showTitanInc && calculations.increases.totalPower > 0 && (
                            <span className="result-increase">+{calculations.increases.totalPower}%</span>
                          )}
                          {compatibility === '相性有利' && calculations.increases.compatibilityPowerBonus > 0 && (
                            <span className="compat-increase"> {showTitanInc && calculations.increases.totalPower > 0 ? '' : ''}相性増分 +{calculations.increases.compatibilityPowerBonus}%</span>
                          )}
                        </div>
                      ) : null}
                      {showAwakeningInc && calculations.awakeningIncreases.totalPower > 0 && (
                        <div className="increase-row-awakening">
                          <span className="result-increase result-increase-awakening" title="覚醒ON/OFFでの増分">覚醒 +{calculations.awakeningIncreases.totalPower}%</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* 編成総合強さ値（大きく強調） */}
                  <div className="result-box result-gold-40 result-clickable" {...statProps('totalStrength', formatNumber(calculations.totalStrength))}>
                    <div className="result-label">
                      <span>編成総合強さ値</span>
                    </div>
                    <div className="result-value result-value-xl value-yellow">
                      {formatNumber(calculations.totalStrength)}
                    </div>
                    {(showTitanInc && calculations.increases.totalStrength > 0) || (compatibility === '相性有利' && calculations.increases.compatibilityStrengthBonus > 0) ? (
                      <div className="increase-row">
                        {showTitanInc && calculations.increases.totalStrength > 0 && (
                          <span className="result-increase">+{calculations.increases.totalStrength}%</span>
                        )}
                        {compatibility === '相性有利' && calculations.increases.compatibilityStrengthBonus > 0 && (
                          <span className="compat-increase"> {showTitanInc && calculations.increases.totalStrength > 0 ? '' : ''}相性増分 +{calculations.increases.compatibilityStrengthBonus}%</span>
                        )}
                      </div>
                    ) : null}
                    {showAwakeningInc && calculations.awakeningIncreases.totalStrength > 0 && (
                      <div className="increase-row-awakening">
                        <span className="result-increase result-increase-awakening" title="覚醒ON/OFFでの増分">覚醒 +{calculations.awakeningIncreases.totalStrength}%</span>
                      </div>
                    )}
                  </div>

                  {/* 編成の火力耐久比 */}
                  <div className="result-box result-box-muted result-clickable" {...statProps('powerDurabilityRatio', formatNumber(calculations.powerDurabilityRatio))}>
                    <div className="result-label">
                      編成の火力耐久比
                    </div>
                    <div className="result-value result-value-sm">
                      {formatNumber(calculations.powerDurabilityRatio)}
                    </div>
                  </div>
                </div>
                </div>
              </div>
            </div>
          </div>

          {/* システム開発ログ */}
          <div className="card" style={{ marginTop: '1.5rem' }}>
            <div className="card-header" onClick={() => toggleTab('devLog')}>
              <h2>📝 システム開発ログ</h2>
              <span className={`collapse-icon ${!expandedTabs.devLog ? 'collapsed' : ''}`}>▼</span>
            </div>
            <div className={`card-content ${!expandedTabs.devLog ? 'hidden' : ''}`}>
              <div className="space-y-2">
                {devLog.slice(devLogPage * DEVLOG_PAGE_SIZE, (devLogPage + 1) * DEVLOG_PAGE_SIZE).map((log, i) => (
                  <div key={i} className="devlog-row">
                    <span className="devlog-date">{log.date}</span>
                    {log.version && <span className="devlog-version">{log.version}</span>}
                    <span className={`devlog-badge devlog-cat-${devLogCategoryClass[log.category] || 'other'}`}>{log.category}</span>
                    <span className="devlog-text">{log.text}</span>
                  </div>
                ))}
              </div>
              {devLog.length > DEVLOG_PAGE_SIZE && (() => {
                const totalPages = Math.ceil(devLog.length / DEVLOG_PAGE_SIZE);
                return (
                  <div className="devlog-pager">
                    <button className="btn btn-secondary" disabled={devLogPage <= 0} onClick={() => setDevLogPage(devLogPage - 1)}>◀ 新しい</button>
                    <span className="devlog-pager-info">{devLogPage + 1} / {totalPages}</span>
                    <button className="btn btn-secondary" disabled={devLogPage >= totalPages - 1} onClick={() => setDevLogPage(devLogPage + 1)}>古い ▶</button>
                  </div>
                );
              })()}
              <div className="devlog-note">
                ※ このログは constants.js の <code>devLog</code> 配列を直接編集することで更新できます（先頭に追加＝最新表示）。バージョン表記は version 付きログの最大値から自動で決まります（軽微な調整は version を省略可）。
              </div>
            </div>
          </div>

          {/* クレジット・注意書き（文言は constants.js の footerInfo） */}
          <footer className="site-footer">
            <p className="footer-notice">{footerInfo.notice}</p>
            <p>
              {footerInfo.contactLead}{' '}
              {footerInfo.contacts.map((ct, i) => (
                <React.Fragment key={ct.label}>
                  {i > 0 && ' または '}
                  {ct.url
                    ? <a href={ct.url} target="_blank" rel="noopener noreferrer">{ct.label}（{ct.id}）</a>
                    : <span>{ct.label}（{ct.id}）</span>}
                </React.Fragment>
              ))}
              {footerInfo.contactTail}
            </p>
            {footerInfo.credits.map((t, i) => <p key={i}>{t}</p>)}
            <p className="footer-copyright">{footerInfo.copyright}</p>
          </footer>

          <StatPopup info={statPopup} onClose={() => setStatPopup(null)} />
        </div>
      );
    }

    ReactDOM.render(<GameCalculator />, document.getElementById('root'));
  </script>
</body>
</html>
